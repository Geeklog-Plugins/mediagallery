name: Modernize MediaGallery media detail page

on:
  push:
    branches:
      - modernize-1.8.0
    paths:
      - '.github/modernize-media-page-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
          fetch-depth: 0

      - name: Patch media description and keyword producers
        run: python tools/patch_media_detail_producer_180.py

      - name: Add responsive media detail CSS
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'MediaGallery 1.8 media detail modernization' public_html/style.css; then
            printf '\n' >> public_html/style.css
            cat tools/media_detail_180.css >> public_html/style.css
          fi

      - name: Update roadmap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ROADMAP.md')
          text = p.read_text(encoding='utf-8')
          needle = '- [x] Complete final public markup audit: one H1 per Podcast page, semantic repeated-card headings, non-link anchors and table-free member enrollment.\n'
          addition = '- [x] Modernize the default media-detail page with semantic article/figure markup, separated navigation/actions, compact metadata and normalized keyword tags.\n'
          if addition not in text:
              if needle not in text:
                  raise SystemExit('ROADMAP insertion point not found')
              text = text.replace(needle, needle + addition)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Validate media detail modernization
        shell: bash
        run: |
          set -euo pipefail
          php -l include/lib-media.php
          grep -q 'mg-media-article' templates/view_image.thtml
          grep -q 'mg-media-pagination' templates/view_image.thtml
          grep -q 'mg-media-tags' templates/view_image.thtml
          grep -q 'class="mg-tag"' include/lib-media.php
          grep -q 'preg_split' include/lib-media.php
          ! grep -q 'style="margin:5px"' include/lib-media.php
          grep -q 'MediaGallery 1.8 media detail modernization' public_html/style.css
          grep -q 'Modernize the default media-detail page' ROADMAP.md

      - name: Commit media detail modernization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hostellerie'
          git config user.email 'hostellerie.org@gmail.com'
          git add include/lib-media.php public_html/style.css ROADMAP.md
          git commit -m 'Complete MediaGallery media detail modernization'
          git push origin HEAD:modernize-1.8.0
