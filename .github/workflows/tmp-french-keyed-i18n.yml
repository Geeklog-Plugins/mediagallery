          PY

      - name: PHP 5.6 syntax checks
        uses: shivammathur/setup-php@v2
        with:
          php-version: '5.6'
          coverage: none
      - shell: bash
        run: |
          php -l language/english_utf-8.php
          php -l language/french_france_utf-8.php
          php -l public_html/album.php

      - name: Verify no known hard-coded album labels remain
        shell: bash
        run: |
          set -euo pipefail
          ! grep -F 'aria-label="Breadcrumb"' templates/album_page.thtml
          ! grep -F 'aria-label="Album actions"' templates/album_page.thtml
          ! grep -F 'aria-label="Album pagination"' templates/album_page.thtml
          ! grep -F 'label="Options"' public_html/album.php
          grep -F "\$LANG_MG01['search'] = 'Rechercher';" language/french_france_utf-8.php
          grep -F "\$LANG_MG01['globalattr'] = 'Modifier globalement les albums';" language/french_france_utf-8.php
          grep -F "\$LANG_MG01['wm_management'] = 'Filigranes';" language/french_france_utf-8.php

      - name: Build installable archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE='mediagallery_1.8.0_2.1.1.zip'
          rm -rf package
          mkdir -p package/mediagallery dist
          find dist -maxdepth 1 -type f -name '*.zip' -delete
          rsync -a ./ package/mediagallery/ \
            --exclude='.git/' --exclude='.gitignore' --exclude='.github/' \
            --exclude='dist/' --exclude='package/' --exclude='.idea/' --exclude='tmp/'
          (
            cd package
            zip -qr "../dist/${ARCHIVE}" mediagallery
          )
          unzip -t "dist/${ARCHIVE}" >/dev/null
          unzip -Z1 "dist/${ARCHIVE}" | grep -qx 'mediagallery/language/french_france_utf-8.php'

      - name: Commit source and archive
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-french-keyed-i18n.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/album_page.thtml public_html/album.php language/english_utf-8.php language/french_france_utf-8.php
          git add -f dist/ .github/workflows/tmp-french-keyed-i18n.yml
          git commit -m 'Use keyed French translations across MediaGallery UI [skip ci]'
          git push origin HEAD:modernize-1.8.0
