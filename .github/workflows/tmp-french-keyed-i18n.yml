name: Temporary French keyed i18n

on:
  push:
    branches: [modernize-1.8.0]
    paths:
      - '.github/workflows/tmp-french-keyed-i18n.yml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
          fetch-depth: 0

      - name: Patch keyed language support
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # 1) Remove hard-coded English accessibility labels from album template.
          p = Path('templates/album_page.thtml')
          s = p.read_text()
          replacements = {
              'aria-label="Breadcrumb"': 'aria-label="{lang_aria_breadcrumb}"',
              'aria-label="Album actions"': 'aria-label="{lang_aria_album_actions}"',
              'aria-label="Album pagination"': 'aria-label="{lang_aria_album_pagination}"',
              'aria-label="Album pagination and information"': 'aria-label="{lang_aria_album_pagination_info}"',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit('Expected template text not found: ' + old)
              s = s.replace(old, new)
          p.write_text(s)

          # 2) Make album.php provide localized labels and remove hard-coded option label.
          p = Path('public_html/album.php')
          s = p.read_text()
          old = '$admin_box .= \'<option label="Options" value="">\' . $LANG_MG01[\'options\'] . \'</option>\' . LB;'
          new = '$admin_box .= \'<option label="\' . MG_escapeHTML($LANG_MG01[\'options\']) . \'" value="">\' . $LANG_MG01[\'options\'] . \'</option>\' . LB;'
          if old not in s:
              raise SystemExit('Hard-coded Options label not found')
          s = s.replace(old, new)
          marker = "    'lang_search'        => $LANG_MG01['search'],\n"
          insert = marker + "    'lang_aria_breadcrumb' => $LANG_MG03['aria_breadcrumb'],\n    'lang_aria_album_actions' => $LANG_MG03['aria_album_actions'],\n    'lang_aria_album_pagination' => $LANG_MG03['aria_album_pagination'],\n    'lang_aria_album_pagination_info' => $LANG_MG03['aria_album_pagination_info'],\n"
          if marker not in s:
              raise SystemExit('Template variable marker not found')
          s = s.replace(marker, insert, 1)
          p.write_text(s)

          # 3) Add canonical English keys used by templates.
          p = Path('language/english_utf-8.php')
          s = p.read_text()
          additions = """
// MediaGallery 1.8.0 accessibility / template labels
$LANG_MG03['aria_breadcrumb'] = 'Breadcrumb';
$LANG_MG03['aria_album_actions'] = 'Album actions';
$LANG_MG03['aria_album_pagination'] = 'Album pagination';
$LANG_MG03['aria_album_pagination_info'] = 'Album pagination and information';
"""
          if "['aria_breadcrumb']" not in s:
              pos = s.rfind('?>')
              if pos == -1:
                  s += additions
              else:
                  s = s[:pos] + additions + s[pos:]
              p.write_text(s)

          # 4) Replace the first value-based French overlay with key-based overrides.
          french = r'''<?php
