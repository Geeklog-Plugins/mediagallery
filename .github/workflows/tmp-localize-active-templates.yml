name: Localize active MediaGallery templates

# Retry with byte-safe PHP patching
on:
  push:
    branches:
      - modernize-1.8.0
    paths:
      - '.github/workflows/tmp-localize-active-templates.yml'

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
          fetch-depth: 0

      - name: Localize active templates
        run: python3 tools/tmp_localize_active_templates.py

      - name: Validate PHP
        run: |
          php -l language/english_utf-8.php
          php -l language/french_france_utf-8.php
          php -l include/lib-media.php
          php -l public_html/album.php
          php -l public_html/search.php

      - name: Verify no targeted English UI literals remain
        run: |
          set -euo pipefail
          ! grep -F 'aria-label="Breadcrumb"' templates/view_image.thtml templates/view_video.thtml templates/view_audio.thtml
          ! grep -F 'aria-label="Media actions and navigation"' templates/view_image.thtml templates/view_video.thtml templates/view_audio.thtml
          ! grep -F 'aria-label="Search results navigation"' templates/search_page.thtml
          ! grep -F '<summary>Media ID</summary>' templates/view_image.thtml

      - name: Build archive
        run: |
          set -euo pipefail
          ARCHIVE='mediagallery_1.8.0_2.1.1.zip'
          rm -rf package
          mkdir -p package/mediagallery dist
          find dist -maxdepth 1 -type f -name '*.zip' -delete
          rsync -a ./ package/mediagallery/ \
            --exclude='.git/' --exclude='.gitignore' --exclude='.github/' \
            --exclude='dist/' --exclude='package/' --exclude='tools/tmp_localize_active_templates.py' \
            --exclude='I18N_AUDIT.md'
          (cd package && zip -qr "../dist/${ARCHIVE}" mediagallery)
          unzip -t "dist/${ARCHIVE}" >/dev/null

      - name: Commit and clean temporary files
        run: |
          set -euo pipefail
          rm -f tools/tmp_localize_active_templates.py .github/workflows/tmp-localize-active-templates.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add language/english_utf-8.php language/french_france_utf-8.php include/lib-media.php public_html/album.php public_html/search.php templates/
          git add -f dist/ tools/tmp_localize_active_templates.py .github/workflows/tmp-localize-active-templates.yml
          git commit -m 'Route active template labels through language keys [skip ci]'
          git push origin HEAD:modernize-1.8.0
