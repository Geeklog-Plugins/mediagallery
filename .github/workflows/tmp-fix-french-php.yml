name: Temporary French PHP boundary fix

on:
  push:
    branches:
      - modernize-1.8.0
    paths:
      - '.github/workflows/tmp-fix-french-php.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.8.0
          fetch-depth: 0
      - name: Remove premature PHP closing tag
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('language/french_france_utf-8.php')
          s = p.read_text(encoding='utf-8')
          marker = "?>\n\n// ---------------------------------------------------------------------------\n// French administration/configuration coverage - batch 2"
          replacement = "// ---------------------------------------------------------------------------\n// French administration/configuration coverage - batch 2"
          if marker not in s:
              raise SystemExit('Expected premature PHP closing tag marker not found')
          s = s.replace(marker, replacement, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/tmp-fix-french-php.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add language/french_france_utf-8.php .github/workflows/tmp-fix-french-php.yml
          git commit -m "Keep French MediaGallery translations inside PHP"
          git push origin HEAD:modernize-1.8.0
