name: Fix MediaGallery card click target

on:
  push:
    branches: [modernize-1.8.0]
    paths:
      - '.github/fix-card-click-target-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch click target and archive guard
        run: python3 tools/fix-card-click-target-180.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'MediaGallery 1.8 reliable card click target' public_html/style.css
          grep -F 'pointer-events: none;' public_html/style.css
          grep -F 'Archive still contains a stale audio-player.js template reference' .github/workflows/build-dist.yml
          if grep -RIn --include='*.thtml' 'audio-player\.js' templates; then
            echo 'Stale audio-player.js template reference remains' >&2
            exit 1
          fi
      - name: Remove temporary tooling
        run: |
          rm -f tools/fix-card-click-target-180.py
          rm -f .github/workflows/fix-card-click-target-180.yml
          rm -f .github/fix-card-click-target-trigger
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hostellerie'
          git config user.email 'hostellerie.org@gmail.com'
          git add -A
          git commit -m 'Make MediaGallery card links reliably clickable'
          git push
