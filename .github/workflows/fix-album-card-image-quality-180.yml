name: Fix MediaGallery album card image quality

on:
  push:
    branches: [modernize-1.8.0]
    paths:
      - '.github/fix-album-card-image-quality-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch album card image quality
        run: python3 tools/fix-album-card-image-quality-180.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          grep -F '$card_cover_source = $original_card_url;' include/classMedia.php
          grep -F '$card_full_source = $original_card_url;' include/classMedia.php
          grep -A5 -F '.mg-album-default-grid .mg-card-square .mg-card-preview-cover {' public_html/style.css | grep -F 'transform: none;'
          grep -A4 -F '.mg-album-default-grid .mg-card-square:hover .mg-card-preview-full,' public_html/style.css | grep -F 'transform: none;'
          php -l include/classMedia.php
      - name: Remove temporary tooling
        run: |
          rm -f tools/fix-album-card-image-quality-180.py
          rm -f .github/workflows/fix-album-card-image-quality-180.yml
          rm -f .github/fix-album-card-image-quality-trigger
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hostellerie'
          git config user.email 'hostellerie.org@gmail.com'
          git add -A
          git commit -m 'Use crisp originals for MediaGallery album cards'
          git push
