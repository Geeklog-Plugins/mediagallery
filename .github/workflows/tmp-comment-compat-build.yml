name: Temporary MediaGallery comment compatibility build

on:
  push:
    branches:
      - modernize-1.8.0
    paths:
      - '.github/workflows/tmp-comment-compat-build.yml'

permissions:
  contents: write

jobs:
  fix-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
          fetch-depth: 0

      - name: Apply Geeklog comment callback compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; p=Path('functions_legacy.inc'); s=p.read_text(); old=\"function plugin_getcommenturlid_mediagallery(\\$id)\\n{\\n    global \\$_CONF, \\$_MG_CONF;\\n\\t\\n\\treturn \\$_MG_CONF['site_url'] . \\\"/media.php?s=\\$id\\\";\\n}\\n\"; new=\"function plugin_getcommenturlid_mediagallery(\\$id = '')\\n{\\n    global \\$_MG_CONF;\\n\\n    // Geeklog 2.1.1 calls this callback without an item id and expects\\n    // array(base URL, id parameter name). Newer Geeklog versions pass the id\\n    // and expect the complete item URL.\\n    if (\\$id === '' || \\$id === null) {\\n        return array(\\$_MG_CONF['site_url'] . '/media.php', 's');\\n    }\\n\\n    return \\$_MG_CONF['site_url'] . '/media.php?s=' . rawurlencode(\\$id);\\n}\\n\"; assert s.count(old)==1, 'Expected callback block not found exactly once'; p.write_text(s.replace(old,new,1))"

      - name: Setup PHP 5.6
        uses: shivammathur/setup-php@v2
        with:
          php-version: '5.6'
          coverage: none

      - name: PHP 5.6 syntax checks
        run: |
          php -l functions_legacy.inc
          php -l include/classMedia.php

      - name: Build installable archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE='mediagallery_1.8.0_2.1.1.zip'
          rm -rf package
          mkdir -p package/mediagallery dist
          find dist -maxdepth 1 -type f \( -name 'mediagallery-*.zip' -o -name 'mediagallery_*.zip' -o -name '*.zip.sha256' \) -delete
          rsync -a ./ package/mediagallery/ --exclude='.git/' --exclude='.gitignore' --exclude='.github/' --exclude='.build-request' --exclude='dist/' --exclude='package/' --exclude='.idea/' --exclude='tmp/'
          printf '%s\n' 'MediaGallery 1.8.0 test archive' 'Geeklog target: 2.1.1+' 'Source branch: modernize-1.8.0' 'Compatibility fixes: COM_strftime fallback and comment URL callback' > package/mediagallery/BUILD_INFO.txt
          (cd package && zip -qr "../dist/${ARCHIVE}" mediagallery)
          unzip -t "dist/${ARCHIVE}" >/dev/null
          unzip -p "dist/${ARCHIVE}" mediagallery/functions_legacy.inc | grep -Fq "function plugin_getcommenturlid_mediagallery(\$id = '')"
          unzip -p "dist/${ARCHIVE}" mediagallery/functions_legacy.inc | grep -Fq "return array(\$_MG_CONF['site_url'] . '/media.php', 's');"
          unzip -p "dist/${ARCHIVE}" mediagallery/include/classMedia.php | grep -Fq "function_exists('COM_strftime')"

      - name: Commit compatibility fix and rebuilt archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-comment-compat-build.yml
          git add functions_legacy.inc
          git add -f dist/mediagallery_1.8.0_2.1.1.zip
          git commit -m 'Support Geeklog 2.1.1 comment URL callback and rebuild archive [skip ci]'
          git push origin HEAD:modernize-1.8.0
