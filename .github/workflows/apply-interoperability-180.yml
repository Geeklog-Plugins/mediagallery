name: Finalize MediaGallery interoperability patch

on:
  push:
    branches:
      - modernize-1.8.0

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
          fetch-depth: 0

      - name: Avoid duplicate recursive delete event
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('include/batch.php')
          text = p.read_text()
          old = """    MG_notifyAlbumDeleted180($album_id);
    if ($target_id > 0) {
        MG_notifyAlbumSaved180($target_id);
    }
"""
          new = """    // Recursive deletion already announces the root album from
    // MG_deleteChildAlbums(); moving content deletes only this album here.
    if ($target_id > 0) {
        MG_notifyAlbumDeleted180($album_id);
        MG_notifyAlbumSaved180($target_id);
    }
"""
          if old not in text:
              raise SystemExit('Delete notification block not found')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: PHP syntax check
        run: php -l include/batch.php

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include/batch.php
          git commit -m "Avoid duplicate album deletion event"
          git push origin HEAD:modernize-1.8.0
