name: Apply French EXIF localization

on:
  push:
    branches:
      - modernize-1.8.0
    paths:
      - '.github/workflows/tmp-apply-french-exif.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
          fetch-depth: 0

      - name: Generate French EXIF labels
        run: python3 tools/tmp_apply_french_exif.py

      - name: Validate PHP
        run: php -l language/french_france_utf-8.php

      - name: Verify explicit EXIF coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          en = Path('language/english_utf-8.php').read_text(encoding='utf-8')
          fr = Path('language/french_france_utf-8.php').read_text(encoding='utf-8')
          m = re.search(r'\$LANG_MG04\s*=\s*array\s*\((.*?)\n\);', en, re.S)
          keys = set(re.findall(r"^\s*'([^']+)'\s*=>", m.group(1), re.M))
          translated = set(re.findall(r"\$LANG_MG04\['([^']+)'\]\s*=", fr))
          missing = sorted(keys - translated)
          print('EXIF keys:', len(keys), 'translated:', len(keys & translated), 'missing:', len(missing))
          if missing:
              raise SystemExit('Missing EXIF keys: ' + ', '.join(missing))
          PY

      - name: Build archive
        run: |
          set -euo pipefail
          ARCHIVE='mediagallery_1.8.0_2.1.1.zip'
          rm -rf package
          mkdir -p package/mediagallery dist
          find dist -maxdepth 1 -type f -name '*.zip' -delete
          rsync -a ./ package/mediagallery/ \
            --exclude='.git/' --exclude='.gitignore' --exclude='.github/' \
            --exclude='dist/' --exclude='package/' --exclude='tools/tmp_apply_french_exif.py' \
            --exclude='I18N_AUDIT.md'
          (cd package && zip -qr "../dist/${ARCHIVE}" mediagallery)
          unzip -t "dist/${ARCHIVE}" >/dev/null

      - name: Commit and clean temporary files
        run: |
          set -euo pipefail
          rm -f tools/tmp_apply_french_exif.py .github/workflows/tmp-apply-french-exif.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add language/french_france_utf-8.php
          git add -f dist/ tools/tmp_apply_french_exif.py .github/workflows/tmp-apply-french-exif.yml
          git commit -m 'Complete French EXIF IPTC localization [skip ci]'
          git push origin HEAD:modernize-1.8.0
