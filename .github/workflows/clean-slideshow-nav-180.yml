name: Clean MediaGallery slideshow navigation

on:
  push:
    branches: [ modernize-1.8.0 ]
    paths:
      - '.github/clean-slideshow-nav-trigger'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
          fetch-depth: 0
      - name: Apply cleanup
        run: python3 tools/remove-slideshow-nav-haze.py
      - name: Validate cleanup
        run: |
          grep -q 'MediaGallery 1.8 clean slideshow navigation' public_html/style.css
          grep -q 'backdrop-filter: none' public_html/style.css
      - name: Remove temporary tooling
        run: rm -f tools/remove-slideshow-nav-haze.py .github/workflows/clean-slideshow-nav-180.yml .github/clean-slideshow-nav-trigger
      - name: Commit cleanup
        run: |
          git config user.name hostellerie
          git config user.email hostellerie.org@gmail.com
          git add -A
          git commit -m "Remove slideshow navigation haze"
          git push origin HEAD:modernize-1.8.0
