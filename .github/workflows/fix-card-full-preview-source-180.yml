name: Fix MediaGallery card full preview source

on:
  push:
    branches: [modernize-1.8.0]
    paths:
      - '.github/fix-card-full-preview-source-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch full preview sources
        run: python3 tools/fix-card-full-preview-source-180.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          php -l include/classMedia.php
          php -l include/common.php
          grep -F "card_full_source" include/classMedia.php
          grep -F "album_full_image" include/common.php
          grep -F 'src="{album_full_image}"' templates/album_page_album_cell.thtml
      - name: Remove temporary tooling
        run: |
          rm -f tools/fix-card-full-preview-source-180.py
          rm -f .github/workflows/fix-card-full-preview-source-180.yml
          rm -f .github/fix-card-full-preview-source-trigger
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hostellerie'
          git config user.email 'hostellerie.org@gmail.com'
          git add -A
          git commit -m 'Reveal complete portrait images in MediaGallery cards'
          git push
