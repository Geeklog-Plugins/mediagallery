name: Temporary CSS surgical fix 2

on:
  push:
    branches:
      - modernize-1.8.0

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
          fetch-depth: 0
      - name: Apply targeted CSS fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public_html/style.css')
          s = p.read_text()

          old_stage = '''.mg-slideshow-stage {
            box-sizing: border-box;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
          }
          .mg-slideshow-image {
            display: block;
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            margin: 0;
            object-fit: contain;
            object-position: center center;
          }
          '''
          new_stage = '''#mgSlideshow .mg-slideshow-stage {
            box-sizing: border-box;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
          }
          #mgSlideshow .mg-slideshow-stage > .mg-slideshow-image {
            display: block;
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            margin: 0;
            box-sizing: border-box;
            object-fit: contain;
            object-position: center center;
          }
          '''
          old_stage = '\n'.join(line[10:] if line.startswith('          ') else line for line in old_stage.splitlines()) + '\n'
          new_stage = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_stage.splitlines()) + '\n'
          if s.count(old_stage) != 1:
              raise SystemExit('Expected slideshow block not found exactly once')
          s = s.replace(old_stage, new_stage, 1)

          old_full = '''.mg-album-default-grid .mg-card-square .mg-card-preview-full {
            object-fit: contain;
            opacity: 0;
            transform: none;
            transition: opacity .25s ease;
          }
          '''
          new_full = '''.mg-album-default-grid .mg-card-square .mg-card-preview-full {
            object-fit: contain;
            background: #08090b;
            opacity: 0;
            transform: none;
            transition: opacity .25s ease;
          }
          '''
          old_full = '\n'.join(line[10:] if line.startswith('          ') else line for line in old_full.splitlines()) + '\n'
          new_full = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_full.splitlines()) + '\n'
          if s.count(old_full) != 1:
              raise SystemExit('Expected card preview block not found exactly once')
          s = s.replace(old_full, new_full, 1)

          p.write_text(s)
          PY
      - name: Commit targeted fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-css-surgical-fix-2.yml
          git add public_html/style.css
          git commit -m 'Contain slideshow images and darken preview letterbox [skip ci]'
          git push origin HEAD:modernize-1.8.0
