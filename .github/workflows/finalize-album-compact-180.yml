name: Finalize MediaGallery compact album cards

on:
  push:
    branches:
      - modernize-1.8.0
    paths:
      - '.github/finalize-album-compact-trigger'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
          fetch-depth: 0

      - name: Apply compact album finalizer
        run: python tools/finalize_album_compact_180.py

      - name: Validate compact album rendering
        shell: bash
        run: |
          set -euo pipefail
          php -l include/classMedia.php
          grep -q "media_date_short" include/classMedia.php
          grep -q "mg-card-meta-compact" templates/album_page_media_cell.thtml
          ! grep -q "rating_box" templates/album_page_media_cell.thtml
          ! grep -q "media_keywords" templates/album_page_media_cell.thtml
          grep -q "mg-album-inline-actions" templates/album_page.thtml
          ! grep -q "album_id_display" templates/album_page.thtml
          grep -q "MediaGallery 1.8 compact album cards" public_html/style.css
          grep -q "Simplify default album cards" ROADMAP.md

      - name: Remove temporary finalizer files
        shell: bash
        run: |
          rm -f tools/finalize_album_compact_180.py
          rm -f .github/workflows/finalize-album-compact-180.yml
          rm -f .github/finalize-album-compact-trigger

      - name: Commit compact album finalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hostellerie'
          git config user.email 'hostellerie.org@gmail.com'
          git add -A
          git commit -m 'Simplify MediaGallery album cards and controls'
          git push origin HEAD:modernize-1.8.0
