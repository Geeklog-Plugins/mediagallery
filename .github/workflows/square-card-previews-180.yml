name: Square MediaGallery card previews
on:
  push:
    paths:
      - '.github/square-card-previews-trigger'
permissions:
  contents: write
jobs:
  square:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
      - name: Apply square card previews
        run: python3 tools/square_card_previews_180.py
      - name: Validate PHP syntax
        run: |
          php -l include/classMedia.php
          php -l include/common.php
      - name: Validate square rendering
        run: |
          grep -q 'mg-card-square' templates/album_page_media_cell.thtml
          grep -q 'mg-card-square' templates/album_page_album_cell.thtml
          grep -q 'square album and root card previews' public_html/style.css
          grep -q 'object-fit: cover' public_html/style.css
      - name: Remove temporary tooling
        run: |
          rm -f tools/square_card_previews_180.py
          rm -f .github/workflows/square-card-previews-180.yml
          rm -f .github/square-card-previews-trigger
      - name: Commit changes
        run: |
          git config user.name hostellerie
          git config user.email hostellerie.org@gmail.com
          git add -A
          git commit -m 'Use square cropped previews for MediaGallery cards'
          git push origin modernize-1.8.0
