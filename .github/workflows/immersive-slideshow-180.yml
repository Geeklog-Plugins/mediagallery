name: Immersive MediaGallery slideshow

on:
  push:
    paths:
      - '.github/immersive-slideshow-trigger'

permissions:
  contents: write

jobs:
  modernize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
          fetch-depth: 0
      - name: Apply immersive slideshow patch
        run: python3 tools/modernize_slideshow_180.py
      - name: Validate templates and PHP
        run: |
          grep -q 'mg-slideshow-shell' templates/slideshow.thtml
          grep -q 'noindex,follow' public_html/slideshow.php
          grep -q 'json_encode($PhotoURL)' public_html/slideshow.php
          grep -q 'photo_count.*$photoCount' public_html/slideshow.php
          grep -q 'MediaGallery 1.8 immersive slideshow' public_html/style.css
          php -l public_html/slideshow.php
      - name: Remove temporary tooling
        run: |
          rm -f tools/modernize_slideshow_180.py
          rm -f .github/workflows/immersive-slideshow-180.yml
          rm -f .github/immersive-slideshow-trigger
      - name: Commit immersive slideshow
        run: |
          git config user.name 'hostellerie'
          git config user.email 'hostellerie.org@gmail.com'
          git add -A
          git commit -m 'Modernize MediaGallery immersive slideshow'
          git push origin HEAD:modernize-1.8.0
