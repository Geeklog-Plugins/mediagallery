name: Patch MediaGallery 1.8 schema upgrade

on:
  push:
    branches:
      - modernize-1.8.0
    paths:
      - '.github/workflows/tmp-schema-upgrade-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
          fetch-depth: 0

      - name: Patch upgrade and post-install schema checks
        run: python3 tools/tmp_schema_upgrade_patch.py

      - name: Validate patched PHP
        run: |
          php -l autoinstall.php
          php -l functions.inc
          php -l include/schema_180.php

      - name: Commit patch and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/tmp_schema_upgrade_patch.py .github/workflows/tmp-schema-upgrade-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add autoinstall.php include/schema_180.php functions.inc
          git add -f tools/tmp_schema_upgrade_patch.py .github/workflows/tmp-schema-upgrade-patch.yml
          git commit -m 'Repair incomplete album schemas during 1.8 upgrade [skip ci]'
          git push origin HEAD:modernize-1.8.0
