name: Fix MediaGallery card preview sources

on:
  push:
    branches: [modernize-1.8.0]
    paths:
      - '.github/fix-card-preview-sources-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch preview sources
        run: python3 tools/fix-card-preview-sources-180.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          grep -F '$card_cover_source = $direct_url;' include/classMedia.php
          grep -F '$card_full_source = self::getFileUrl('"'"'orig'"'"'' include/classMedia.php
          grep -F '$album_full_image = $original_cover_image;' include/common.php
          php -l include/classMedia.php
          php -l include/common.php
      - name: Remove temporary tooling
        run: |
          rm -f tools/fix-card-preview-sources-180.py
          rm -f .github/workflows/fix-card-preview-sources-180.yml
          rm -f .github/fix-card-preview-sources-trigger
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hostellerie'
          git config user.email 'hostellerie.org@gmail.com'
          git add -A
          git commit -m 'Use sharp covers and full originals in MediaGallery cards'
          git push
