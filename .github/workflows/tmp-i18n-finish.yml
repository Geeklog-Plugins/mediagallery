name: Finalize keyed i18n wiring

on:
  push:
    branches:
      - modernize-1.8.0
    paths:
      - '.github/workflows/tmp-i18n-finish.yml'

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
          fetch-depth: 0

      - name: Patch album language wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('public_html/album.php')
          s = p.read_text()
          old = "$admin_box .= '<option label=\"Options\" value=\"\">' . $LANG_MG01['options'] . '</option>' . LB;"
          new = "$admin_box .= '<option label=\"' . MG_escapeHTML($LANG_MG01['options']) . '\" value=\"\">' . $LANG_MG01['options'] . '</option>' . LB;"
          if old in s:
              s = s.replace(old, new, 1)
          marker = "    'lang_search'        => $LANG_MG01['search'],\n"
          additions = (
              marker
              + "    'lang_aria_breadcrumb' => $LANG_MG03['aria_breadcrumb'],\n"
              + "    'lang_aria_album_actions' => $LANG_MG03['aria_album_actions'],\n"
              + "    'lang_aria_album_pagination' => $LANG_MG03['aria_album_pagination'],\n"
              + "    'lang_aria_album_pagination_info' => $LANG_MG03['aria_album_pagination_info'],\n"
          )
          if "'lang_aria_breadcrumb'" not in s:
              if marker not in s:
                  raise SystemExit('lang_search marker not found')
              s = s.replace(marker, additions, 1)
          p.write_text(s)

          p = Path('language/english_utf-8.php')
          s = p.read_text()
          block = """
// MediaGallery 1.8.0 template accessibility labels
$LANG_MG03['aria_breadcrumb'] = 'Breadcrumb';
$LANG_MG03['aria_album_actions'] = 'Album actions';
$LANG_MG03['aria_album_pagination'] = 'Album pagination';
$LANG_MG03['aria_album_pagination_info'] = 'Album pagination and information';
"""
          if "['aria_breadcrumb']" not in s:
              pos = s.rfind('?>')
              if pos >= 0:
                  s = s[:pos] + block + s[pos:]
              else:
                  s += block
              p.write_text(s)
          PY

      - name: Verify wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -F "'lang_aria_breadcrumb' => \$LANG_MG03['aria_breadcrumb']" public_html/album.php
          grep -F "\$LANG_MG03['aria_breadcrumb'] = 'Breadcrumb';" language/english_utf-8.php
          grep -F "\$LANG_MG01['search'] = 'Rechercher';" language/french_france_utf-8.php
          grep -F "\$LANG_MG01['globalattr'] = 'Modifier globalement les albums';" language/french_france_utf-8.php
          grep -F "\$LANG_MG01['wm_management'] = 'Filigranes';" language/french_france_utf-8.php
          ! grep -F 'aria-label="Breadcrumb"' templates/album_page.thtml
          ! grep -F 'aria-label="Album actions"' templates/album_page.thtml
          ! grep -F 'label="Options" value=""' public_html/album.php

      - name: Setup PHP 5.6
        uses: shivammathur/setup-php@v2
        with:
          php-version: '5.6'
          coverage: none

      - name: PHP syntax checks
        shell: bash
        run: |
          php -l public_html/album.php
          php -l language/english_utf-8.php
          php -l language/french_france_utf-8.php

      - name: Build archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE='mediagallery_1.8.0_2.1.1.zip'
          rm -rf package
          mkdir -p package/mediagallery dist
          find dist -maxdepth 1 -type f -name '*.zip' -delete
          rsync -a ./ package/mediagallery/ \
            --exclude='.git/' \
            --exclude='.gitignore' \
            --exclude='.github/' \
            --exclude='dist/' \
            --exclude='package/' \
            --exclude='.idea/' \
            --exclude='tmp/'
          (cd package && zip -qr "../dist/${ARCHIVE}" mediagallery)
          unzip -t "dist/${ARCHIVE}" >/dev/null
          unzip -Z1 "dist/${ARCHIVE}" | grep -qx 'mediagallery/language/french_france_utf-8.php'

      - name: Commit source and archive
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-i18n-finish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public_html/album.php language/english_utf-8.php templates/album_page.thtml language/french_france_utf-8.php
          git add -f dist/ .github/workflows/tmp-i18n-finish.yml
          git commit -m 'Finalize keyed French localization and rebuild archive [skip ci]'
          git push origin HEAD:modernize-1.8.0
