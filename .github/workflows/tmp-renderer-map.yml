name: Map remaining template renderers

on:
  push:
    branches:
      - modernize-1.8.0
    paths:
      - '.github/workflows/tmp-renderer-map.yml'

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
      - name: Locate template renderers
        shell: bash
        run: |
          set +e
          for name in fsat.thtml xspf_radio.thtml playall_xspf.thtml gl_story_import.thtml fslideshow.thtml view_asf.thtml view_swf.thtml view_mp3_wmp.thtml export.thtml sessions.thtml view_mp3_qt.thtml album_page_album_cell.thtml flvmg.thtml flvfp.thtml; do
            echo "===== $name ====="
            grep -R -n --exclude-dir=.git --exclude-dir=dist --exclude-dir=docs --exclude='*.html' "$name" . || true
          done
          echo '===== hard-coded PHP messages ====='
          grep -R -n --exclude-dir=.git --exclude-dir=dist --exclude-dir=docs -E "Thanks for your rate|ERROR :|Export Script Ready for Download|XML Mini SlideShow" public_html admin include *.php 2>/dev/null || true
