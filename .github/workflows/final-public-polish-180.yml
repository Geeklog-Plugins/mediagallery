name: Final MediaGallery public polish

on:
  push:
    branches: [ modernize-1.8.0 ]
    paths:
      - '.github/final-public-polish-trigger'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
          fetch-depth: 0

      - name: Apply final public polish
        run: python3 tools/final_public_polish_180.py

      - name: Validate final polish
        shell: bash
        run: |
          php -l public_html/media.php
          php -l public_html/slideshow.php
          php -l include/lib-media.php
          grep -q "media_title_plain" include/lib-media.php
          grep -q "mg-compact-search" templates/album_page.thtml
          grep -q "mg-compact-search" templates/view_image.thtml
          grep -q "MediaGallery 1.8 final visual polish" public_html/style.css
          grep -q "\\u23f8" templates/slideshow.thtml

      - name: Remove temporary tooling
        run: git rm -f tools/final_public_polish_180.py .github/workflows/final-public-polish-180.yml .github/final-public-polish-trigger

      - name: Commit final public polish
        shell: bash
        run: |
          git config user.name "hostellerie"
          git config user.email "hostellerie.org@gmail.com"
          git add -A
          git commit -m "Polish MediaGallery public presentation"
          git push origin HEAD:modernize-1.8.0
