name: Temporary full i18n audit

on:
  push:
    branches:
      - modernize-1.8.0
    paths:
      - '.github/workflows/tmp-i18n-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
          fetch-depth: 0

      - name: Build localization audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def english_keys(path):
              keys = set()
              current = None
              depth = 0
              for line in Path(path).read_text(encoding='utf-8').splitlines():
                  m = re.search(r'\$(LANG_MG\d+)\s*=\s*array\s*\(', line)
                  if m:
                      current = m.group(1)
                      depth = 1
                      continue
                  if current:
                      km = re.match(r"\s*'([^']+)'\s*=>", line)
                      if km:
                          keys.add((current, km.group(1)))
                      depth += line.count('array (') + line.count('array(')
                      depth -= line.count(');')
                      if depth <= 0:
                          current = None
                  for am in re.finditer(r"\$(LANG_MG\d+)\['([^']+)'\]\s*=", line):
                      keys.add((am.group(1), am.group(2)))
              return keys

          def french_keys(path):
              text = Path(path).read_text(encoding='utf-8')
              return set(re.findall(r"\$(LANG_MG\d+)\['([^']+)'\]\s*=", text))

          en = english_keys('language/english_utf-8.php')
          fr = french_keys('language/french_france_utf-8.php')
          missing = sorted(en - fr)

          # UI hard-coded text candidates in templates/PHP. This is intentionally
          # conservative: only obvious user-facing HTML labels/text are reported.
          candidates = []
          text_re = re.compile(r'>\s*([A-Z][A-Za-z][A-Za-z0-9 /&,:;.!?()\-]{2,})\s*<')
          attr_re = re.compile(r'\b(?:aria-label|title|placeholder|value|label)="([A-Z][A-Za-z][A-Za-z0-9 /&,:;.!?()\-]{2,})"')
          roots = [Path('templates'), Path('public_html'), Path('admin')]
          for root in roots:
              if not root.exists():
                  continue
              for p in root.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in {'.php', '.thtml', '.html', '.js'}:
                      continue
                  try:
                      lines = p.read_text(encoding='utf-8', errors='ignore').splitlines()
                  except Exception:
                      continue
                  for n, line in enumerate(lines, 1):
                      if '$LANG_' in line or '{lang_' in line:
                          continue
                      for rx in (text_re, attr_re):
                          for m in rx.finditer(line):
                              value = m.group(1).strip()
                              if value in {'DOCTYPE', 'UTF'}:
                                  continue
                              candidates.append((str(p), n, value))

          out = []
          out.append('# MediaGallery French localization audit')
          out.append('')
          out.append(f'- English keys detected: **{len(en)}**')
          out.append(f'- French keyed overrides: **{len(fr)}**')
          out.append(f'- Keys still without explicit French override: **{len(missing)}**')
          out.append(f'- Hard-coded UI candidates: **{len(candidates)}**')
          out.append('')
          out.append('## Missing French keys')
          out.append('')
          for array, key in missing:
              out.append(f'- `{array}[{key}]`')
          out.append('')
          out.append('## Hard-coded UI candidates')
          out.append('')
          for path, line, value in candidates:
              out.append(f'- `{path}:{line}` — `{value}`')
          out.append('')
          Path('I18N_AUDIT.md').write_text('\n'.join(out) + '\n', encoding='utf-8')
          print('\n'.join(out[:12]))
          PY

      - name: Commit audit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add I18N_AUDIT.md
          git commit -m 'Generate French localization audit [skip ci]'
          git push origin HEAD:modernize-1.8.0
